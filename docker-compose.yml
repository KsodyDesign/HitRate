services:
  postgres:
    image: postgres:16-alpine
    container_name: hitrate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hitrate
      POSTGRES_USER: hitrate
      POSTGRES_PASSWORD: hitrate_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitrate -d hitrate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
